name: Uzumaki Daily Automation

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Version update

      - name: Set up Python
        uses: actions/setup-python@v5 # Version update
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests edge-tts google-api-python-client google-auth-oauthlib google-auth-httplib2
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run Uzumaki Bot
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python bot.py
        
